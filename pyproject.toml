[tool.poetry]
name = "crispy-guacamole"
version = "0.1.0"
description = "A End2End ML project showcasing many components needed to bring your code to production"
authors = ["jm-glowienke <jmglowienke@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
typer = "^0"
fastapi = "^0.115.5"
pydantic = "^2.10.1"

[tool.poetry.group.dev.dependencies]
mypy = "^1.13.0"
black = "^24.10.0"
ruff = "^0.8.0"
pre-commit = "^4.0.1"
ipykernel = "^6.29.5"
isort = "^5.13.2"


[tool.poetry.group.test.dependencies]
pytest = "^8.3.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
crispy-guacamole = "crispy_guacamole.cli:app"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.black]
line-length = 110
force-exclude = "data"
